<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>衣櫃</title>
<style>
  :root { --navy: #0f1b2d; --gold: #d4a843; --gold-2: #f0c96a; --ink: #1c2433; --muted: #6b7486; --bg: #f3f1ec; --line: #e4e0d6; --red: #c2453a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  header { background: var(--navy); color: #fff; padding: 26px 8%; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  header p { margin: 4px 0 0; color: #b9c3d4; }
  main { padding: 28px 8%; max-width: 980px; }
  .save { display: flex; gap: 12px; margin-bottom: 26px; }
  .save input { flex: 1; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; }
  .primary { border: 0; padding: 12px 24px; font-weight: 700; background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: var(--navy); }
  .list { display: grid; gap: 12px; }
  .row { background: #fff; border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row .name { flex: 1; font-size: 18px; font-weight: 700; }
  .row button { border: 1px solid var(--line); background: #fff; padding: 9px 16px; }
  .row .wear { border: 0; background: var(--navy); color: #fff; }
  .row .remove { color: var(--red); }
  .empty { color: var(--muted); padding: 30px 0; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>衣櫃</h1>
    <p id="who">儲存目前的穿著，之後隨時換上。</p>
  </div>
  <button class="primary" id="close">完成</button>
</header>
<main>
  <div class="save">
    <input id="name" maxlength="30" placeholder="服裝名稱（可留白）">
    <button class="primary" id="saveBtn">儲存目前的服裝</button>
  </div>
  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden>還沒有儲存的服裝。到服飾店買好衣服後，回來這裡儲存。</p>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const characters = ['麥可', '富蘭克林', '崔佛'];
const $ = id => document.getElementById(id);
let toastTimer = 0;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 2500);
}
async function load() {
  const data = await game.call('wardrobe.list');
  $('who').textContent = `${characters[data.character] || ''}的衣櫃：儲存目前的穿著，之後隨時換上。`;
  $('empty').hidden = data.outfits.length > 0;
  $('list').replaceChildren(...data.outfits.map((name, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="name"></span><button class="wear">換上</button><button class="remove">刪除</button>';
    row.querySelector('.name').textContent = name;
    row.querySelector('.wear').onclick = async () => { await game.call('wardrobe.wear', i); toast(`已換上「${name}」`); };
    row.querySelector('.remove').onclick = async () => { await game.call('wardrobe.remove', i); load(); };
    return row;
  }));
}
$('saveBtn').onclick = async () => {
  await game.call('wardrobe.save', $('name').value.trim());
  $('name').value = '';
  toast('已儲存目前的服裝');
  load();
};
$('close').onclick = () => game.close();
load();
</script>
</body>
</html>
