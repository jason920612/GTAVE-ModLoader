[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.RayTracing=True
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.VirtualTextures=True
r.Lumen.TranslucencyReflections.FrontLayer.Enable=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; (no engine particles: the game's are composited in; 1024 x 1024 simulation textures took 56 MB)
fx.GPUSimulationTextureSizeX=128
fx.GPUSimulationTextureSizeY=128

[SystemSettings]
; The GPU's memory, which the game shares (research/phase0.md 60.25):
; - ray tracing geometry built when the scene refers to it and let go when it does not; the engine otherwise keeps the
;   last level of each mesh always, and the renderer's meshes have one level: all of it, 600 MB
r.RayTracing.NumAlwaysResidentLODs=0
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=200
; - Lumen's surface cache stays empty for the renderer's meshes (made at run time without card data): 4096 took 220 MB
r.LumenScene.SurfaceCache.AtlasSize=1024

