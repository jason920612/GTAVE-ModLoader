<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>eyefind.info</title>
<style>
  :root { --blue: #3a7fc1; --ink: #222; --bg: #f4f4f4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--blue); color: #fff; padding: 28px 12%; display: flex; align-items: center; gap: 32px; }
  header h1 { margin: 0; font-size: 56px; font-style: italic; letter-spacing: -1px; }
  header h1 span { color: #ffd23f; }
  header input { flex: 1; font-size: 22px; padding: 12px 18px; border: 0; border-radius: 4px; }
  main { padding: 32px 12%; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  a.site { display: block; background: #fff; border-radius: 6px; padding: 24px; text-decoration: none; color: var(--ink);
           box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: transform .1s; }
  a.site:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.2); }
  a.site h2 { margin: 0 0 8px; font-size: 22px; color: var(--blue); }
  #status { padding: 0 12%; color: #666; }
</style>
</head>
<body>
<header>
  <h1>eye<span>find</span>.info</h1>
  <input placeholder="搜尋 Eyefind">
</header>
<p id="status"></p>
<main>
  <a class="site" href="https://www.dynasty8realestate.com/"><h2>朝代 8 房地產</h2>洛聖都的公寓與車庫</a>
</main>
<script>
  // Bridge check: the property mod answers with the character's money.
  if (window.game) {
    game.call('property.cash').then(cash => {
      document.getElementById('status').textContent = '帳戶餘額：$' + Number(cash).toLocaleString();
    }).catch(e => { document.getElementById('status').textContent = e.message; });
  }
</script>
</body>
</html>
